services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seat
      POSTGRES_PASSWORD: seat
      POSTGRES_DB: seat
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seat"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgres://seat:seat@db:5432/seat?sslmode=disable
      PORT: "8080"
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy